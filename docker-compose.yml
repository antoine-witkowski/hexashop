services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hexashop
      POSTGRES_PASSWORD: hexashop
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexashop"]
      interval: 5s
volumes:
  pgdata: